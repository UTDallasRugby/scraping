appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#e87500" # UTD Orange
        - "#154734" # UTD Green
        - "#5fe0b7" # UTD Silverleaf
        - "#ff9933" # Light Orange
        - "#1e5f47" # Light Green
        - "#7fe8c5" # Light Silverleaf
        - "#cc6600" # Dark Orange
        - "#0f3827" # Dark Green
        - "#3fd8a8" # Dark Silverleaf
        - "#f5a962" # Soft Orange
      dark:
        - "#ff9933" # Light Orange (better contrast on dark)
        - "#2d8b64" # Medium Green
        - "#7fe8c5" # Light Silverleaf
        - "#ffb366" # Lighter Orange
        - "#3aa67f" # Lighter Green
        - "#9fedd6" # Lighter Silverleaf
        - "#e87500" # UTD Orange
        - "#1e5f47" # Medium Green
        - "#5fe0b7" # UTD Silverleaf
        - "#ffc799" # Pale Orange
  colorScales:
    default:
      light:
        - "#e87500" # UTD Orange
        - "#154734" # UTD Green
      dark:
        - "#ff9933" # Light Orange
        - "#2d8b64" # Light Green
  colors:
    primary:
      light: "#e87500" # UTD Orange
      dark: "#ff9933" # Light Orange for dark mode
    accent:
      light: "#154734" # UTD Green
      dark: "#2d8b64" # Light Green for dark mode
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages.
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": {}
    "@evidence-dev/csv": {}
    "@evidence-dev/databricks": {}
    "@evidence-dev/duckdb": {}
    "@evidence-dev/mssql": {}
    "@evidence-dev/mysql": {}
    "@evidence-dev/postgres": {}
    "@evidence-dev/source-javascript": {}
    "@evidence-dev/snowflake": {}
    "@evidence-dev/sqlite": {}
    "@evidence-dev/trino": {}
    "@evidence-dev/motherduck": {}
